<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Literata:ital,wght@0,400;1,400&display=swap"
    />
    <title>Synaesthesia Battery Test</title>

    <!-- Social share preview (link unfurls in iMessage/WhatsApp/X/etc).
         NOTE: og:image below is root-relative (/og-image.png) — the spec
         technically wants an absolute URL, and some crawlers don't resolve
         a relative one against the page URL. Once this is deployed to its
         real domain, swap it for the full https://... URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Synaesthesia Battery Test" />
    <meta
      property="og:description"
      content="Do letters and numbers have a colour for you? Take the free, anonymous, ~5 minute test researchers use to check."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Synaesthesia Battery Test" />
    <meta
      name="twitter:description"
      content="Do letters and numbers have a colour for you? Take the free, anonymous, ~5 minute test researchers use to check."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="test-app"></div>
    <script type="module" src="/src/test-main.js"></script>
  </body>
</html>
